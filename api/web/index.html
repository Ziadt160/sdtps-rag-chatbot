<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مساعد خدمات التخطيط العمراني — الشارقة</title>
<style>
  :root {
    --bg: #0f1720; --panel: #18222e; --bot: #1f2c3a; --user: #2563eb;
    --text: #e8eef5; --muted: #8aa0b6; --accent: #2dd4bf; --line: #263544;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 820px; height: 100vh;
    display: flex; flex-direction: column; background: var(--panel);
    border-inline: 1px solid var(--line);
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--bg);
  }
  header .logo {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--user));
    display: grid; place-items: center; font-size: 20px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-start; }
  .row.bot { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 11px 14px; border-radius: 14px; line-height: 1.7;
    font-size: 15px; white-space: pre-wrap; word-wrap: break-word;
  }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); }
  .meta .src { color: var(--accent); }
  .meta .rewrite { display: block; margin-top: 3px; opacity: .8; }
  .meta .cached { color: #fbbf24; margin-inline-start: 8px; }
  .err .bubble { background: #3a1d22; color: var(--danger); }

  .welcome { color: var(--muted); text-align: center; margin: auto 0; }
  .welcome h2 { color: var(--text); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip {
    background: var(--bot); border: 1px solid var(--line); color: var(--text);
    padding: 8px 13px; border-radius: 20px; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }

  .typing { display: flex; gap: 4px; align-items: center; }
  .typing span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: blink 1.4s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--bg);
  }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
    font-family: inherit; font-size: 15px; max-height: 120px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  form button {
    background: var(--accent); color: #062b27; border: none; border-radius: 12px;
    padding: 0 20px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🏛️</div>
    <div>
      <h1>مساعد خدمات التخطيط العمراني</h1>
      <p>دائرة التخطيط العمراني والمساحة — الشارقة</p>
    </div>
    <div class="spacer"></div>
    <button id="reset">محادثة جديدة</button>
  </header>

  <div id="messages">
    <div class="welcome" id="welcome">
      <h2>كيف يمكنني مساعدتك؟</h2>
      <div>اسأل عن أي خدمة من خدمات التخطيط العمراني في الشارقة</div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="اكتب سؤالك هنا..." autofocus></textarea>
    <button type="submit" id="send">إرسال</button>
  </form>
</div>

<script>
const API = "";  // same origin
const SUGGESTIONS = [
  "ما هي الوثائق المطلوبة لطلب بيان التخطيط العمراني؟",
  "كيف أحصل على عدم ممانعة لهدم عقار؟",
  "كيف أستأجر موقعاً مؤقتاً؟",
  "ما هي شهادة عدم الممانعة NOC؟",
];

let sessionId = localStorage.getItem("sdtps_session") || null;

const $messages = document.getElementById("messages");
const $form = document.getElementById("form");
const $input = document.getElementById("input");
const $send = document.getElementById("send");
const $welcome = document.getElementById("welcome");

// suggestion chips
const $chips = document.getElementById("chips");
SUGGESTIONS.forEach(s => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = s; b.type = "button";
  b.onclick = () => { $input.value = s; send(); };
  $chips.appendChild(b);
});

function hideWelcome() { if ($welcome) $welcome.style.display = "none"; }

function addMessage(role, text) {
  hideWelcome();
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  $messages.appendChild(row);
  $messages.scrollTop = $messages.scrollHeight;
  return bubble;
}

function addTyping() {
  hideWelcome();
  const row = document.createElement("div");
  row.className = "row bot"; row.id = "typing-row";
  row.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  $messages.appendChild(row);
  $messages.scrollTop = $messages.scrollHeight;
}
function removeTyping() { const t = document.getElementById("typing-row"); if (t) t.remove(); }

function addMeta(bubble, data) {
  if (!data.sources || !data.sources.length) return;
  const src = data.sources[0];
  const meta = document.createElement("div");
  meta.className = "meta";
  let html = `المصدر: <span class="src">${src.service_name || "—"}</span>`;
  if (src.page != null) html += ` (صفحة ${src.page})`;
  if (data.cached) html += `<span class="cached">⚡ من الذاكرة المؤقتة</span>`;
  if (data.query_used && data.query_used.trim() && data.query_used.trim() !== bubble.dataset.q) {
    html += `<span class="rewrite">↻ ${data.query_used}</span>`;
  }
  meta.innerHTML = html;
  bubble.appendChild(meta);
}

async function send() {
  const text = $input.value.trim();
  if (!text) return;
  $input.value = ""; $input.style.height = "auto";
  $send.disabled = true;
  addMessage("user", text);
  addTyping();
  try {
    const res = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    removeTyping();
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    sessionId = data.session_id;
    localStorage.setItem("sdtps_session", sessionId);
    const bubble = addMessage("bot", data.answer || "(لا توجد إجابة)");
    bubble.dataset.q = text;
    addMeta(bubble, data);
  } catch (e) {
    removeTyping();
    const row = document.createElement("div");
    row.className = "row bot err";
    row.innerHTML = '<div class="bubble">تعذّر الاتصال بالخادم. تأكد من تشغيل الخدمة وحاول مجدداً.</div>';
    $messages.appendChild(row);
  } finally {
    $send.disabled = false;
    $input.focus();
  }
}

$form.addEventListener("submit", e => { e.preventDefault(); send(); });
$input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$input.addEventListener("input", () => {
  $input.style.height = "auto";
  $input.style.height = Math.min($input.scrollHeight, 120) + "px";
});

document.getElementById("reset").addEventListener("click", async () => {
  if (sessionId) {
    try { await fetch(API + "/reset", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId }),
    }); } catch (e) {}
  }
  sessionId = null; localStorage.removeItem("sdtps_session");
  $messages.innerHTML = "";
  $messages.appendChild($welcome); $welcome.style.display = "";
});
</script>
</body>
</html>
