services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama        # cache: pulled LLMs persist
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: sdtps-rag-chatbot:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_AUTO_PULL: ${OLLAMA_AUTO_PULL:-1}
      CACHE_ENABLED: ${CACHE_ENABLED:-1}
      CACHE_SIM_THRESHOLD: ${CACHE_SIM_THRESHOLD:-0.97}
    volumes:
      - hf_cache:/home/app/.cache/huggingface   # cache: BGE-M3 weights persist
      - index_data:/app/data/index              # cache: built index persists
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ollama_models:
  hf_cache:
  index_data:
